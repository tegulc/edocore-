# ============================================================================
# Configuration non sensible, partagee par les services qui en ont besoin.
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: educore-config
  namespace: educore
data:
  DATABASE_URL: "jdbc:postgresql://postgres:5432/educore"
  DATABASE_USER: "educore"
  REDIS_URL: "redis://redis:6379"
  S3_ENDPOINT: "http://minio:9000"
  S3_BUCKET: "educore-documents"
  JWT_EXPIRATION_SECONDS: "900"
  JWT_REFRESH_EXPIRATION_SECONDS: "604800"
  PASSWORD_EXPIRATION_DAYS: "90"
  NOTIFICATIONS_SERVICE_URL: "http://notifications:8081"
  LOG_LEVEL: "INFO"
---
# ============================================================================
# GABARIT de secrets - NE JAMAIS committer de vraies valeurs dans Git.
# En production, generer via `kubectl create secret` ou un gestionnaire dedie
# (Vault, AWS Secrets Manager, Sealed Secrets...), jamais un fichier YAML en clair.
# ============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: educore-secrets
  namespace: educore
type: Opaque
stringData:
  DATABASE_PASSWORD: "changez-moi-en-production"
  JWT_SECRET: "generez-un-secret-aleatoire-256-bits-minimum-en-production"
  NOTIFICATIONS_SERVICE_KEY: "generez-une-cle-aleatoire-en-production"
  IA_SERVICE_KEY: "generez-une-cle-aleatoire-en-production"
  S3_ACCESS_KEY: "changez-moi"
  S3_SECRET_KEY: "changez-moi"
  ORANGE_MONEY_API_KEY: ""
  ORANGE_MONEY_WEBHOOK_SECRET: ""
  MTN_MOMO_API_KEY: ""
  MTN_MOMO_WEBHOOK_SECRET: ""
