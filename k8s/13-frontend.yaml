apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: educore
spec:
  replicas: 2
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: frontend
          # Image de production : `npm run build` puis servi par Nginx (pas le serveur de dev Vite
          # utilise dans docker-compose.yml, reserve au developpement local).
          image: educore/frontend:latest
          ports: [{ containerPort: 80 }]
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: educore
spec:
  selector: { app: frontend }
  ports: [{ port: 80, targetPort: 80 }]
