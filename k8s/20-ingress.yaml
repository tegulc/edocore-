apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: educore-ingress
  namespace: educore
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod # suppose cert-manager deja installe sur le cluster
    nginx.ingress.kubernetes.io/websocket-services: "notifications" # necessaire pour le chat (STOMP over websocket)
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["app.educore.africa", "api.educore.africa"]
      secretName: educore-tls
  rules:
    - host: app.educore.africa
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: frontend, port: { number: 80 } }
    - host: api.educore.africa
      http:
        paths:
          - path: /ws/chat
            pathType: Prefix
            backend:
              service: { name: notifications, port: { number: 8081 } }
          - path: /api/v1/notifications
            pathType: Prefix
            backend:
              service: { name: notifications, port: { number: 8081 } }
          - path: /api/v1/conversations
            pathType: Prefix
            backend:
              service: { name: notifications, port: { number: 8081 } }
          - path: /api/v1/alertes-risque
            pathType: Prefix
            backend:
              service: { name: ia, port: { number: 8082 } }
          - path: /api/v1/assistant
            pathType: Prefix
            backend:
              service: { name: ia, port: { number: 8082 } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: backend, port: { number: 8080 } }
