apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: educore
spec:
  replicas: 2 # stateless (JWT) : scale horizontal sans etat partage a synchroniser
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend }
    spec:
      containers:
        - name: backend
          image: educore/backend:latest # construit via CI/CD (GitHub Actions), voir Volume 7
          ports: [{ containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: educore-config }
            - secretRef: { name: educore-secrets }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests: { cpu: "500m", memory: "512Mi" }
            limits: { cpu: "1500m", memory: "1.5Gi" }
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: educore
spec:
  selector: { app: backend }
  ports: [{ port: 8080, targetPort: 8080 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: educore
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
