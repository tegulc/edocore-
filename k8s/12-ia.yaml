apiVersion: apps/v1
kind: Deployment
metadata:
  name: ia
  namespace: educore
spec:
  replicas: 1 # charge de calcul par lots (recalcul de risque, generation de commentaires), pas de trafic constant
  selector:
    matchLabels: { app: ia }
  template:
    metadata:
      labels: { app: ia }
    spec:
      containers:
        - name: ia
          image: educore/ia-service:latest
          ports: [{ containerPort: 8082 }]
          envFrom:
            - configMapRef: { name: educore-config }
            - secretRef: { name: educore-secrets }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8082 }
            initialDelaySeconds: 20
          resources:
            requests: { cpu: "300m", memory: "384Mi" }
            limits: { cpu: "1", memory: "1Gi" }
---
apiVersion: v1
kind: Service
metadata:
  name: ia
  namespace: educore
spec:
  selector: { app: ia }
  ports: [{ port: 8082, targetPort: 8082 }]
